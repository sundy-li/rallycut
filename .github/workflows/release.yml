name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            target: macos
          - name: Windows amd64
            os: windows-latest
            target: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: extractions/setup-just@v2
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
      - name: Install NSIS
        if: matrix.target == 'windows'
        run: choco install nsis -y --no-progress
      - run: npm --prefix frontend ci
      - name: Build package
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: just package-${{ matrix.target }}
      - name: Record SHA-256 checksums
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          root = Path('build/release')
          files = sorted(p for p in root.iterdir() if p.suffix in {'.zip', '.exe'})
          if not files:
              raise SystemExit('No release files to checksum')
          text = ''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in files)
          (root / 'SHA256SUMS-${{ matrix.target }}.txt').write_text(text, encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: build/release/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          body_path: docs/releases.zh-CN.md
