name: Windows preview

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Windows test version (without v)'
        required: true
        default: '0.1.0-alpha.3-windows.3'
        type: string

permissions:
  contents: read

concurrency:
  group: windows-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Windows x64 environment and installer
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate test version
        shell: pwsh
        run: |
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+-[A-Za-z0-9.-]+$') {
            throw 'Expected a prerelease version without v'
          }
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: extractions/setup-just@v2
      - name: Test environment provisioning logic
        run: go test ./backend/setup ./backend/media
      - name: Test maintained installer contract
        run: python -m unittest discover -s tests/packaging -v
      - name: Build our relocatable CPU runtime, dependency lock and file hashes
        shell: pwsh
        run: |
          python scripts/build_windows_runtime.py 2>&1 | Tee-Object -FilePath windows-runtime-build.log
          if ($LASTEXITCODE -ne 0) { throw 'Portable runtime build failed' }
      - name: Verify relocated environment, model load and real CPU forward
        shell: pwsh
        env:
          RALLYCUT_BUNDLE_E2E: '1'
        run: |
          $env:RALLYCUT_BUNDLE_PATH = (Resolve-Path 'build/runtime-output/RallyCut-runtime-windows-amd64.zip').Path
          go test -v ./backend/setup -run '^TestPrebuiltBundleInstallation$' -count=1 -timeout 18m 2>&1 | Tee-Object -FilePath windows-environment-test.log
          if ($LASTEXITCODE -ne 0) { throw 'Relocated runtime or model forward failed' }
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
      - name: Install NSIS and expose it to Git Bash
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          if ($LASTEXITCODE -notin @(0, 3010)) { throw 'NSIS installation failed' }
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (!(Test-Path (Join-Path $nsis 'makensis.exe'))) { throw 'makensis.exe not found' }
          Add-Content -Path $env:GITHUB_PATH -Value $nsis
      - run: npm --prefix frontend ci
      - name: Build x64 application and installer
        shell: bash
        run: just package-windows
      - name: Smoke-test installer, payload and uninstall data preservation
        shell: pwsh
        timeout-minutes: 15
        run: |
          $root = 'build/release'
          $app = Join-Path $root "RallyCut-$env:VERSION-windows-amd64.exe"
          $installer = Join-Path $root "RallyCut-$env:VERSION-windows-amd64-setup.exe"
          if (!(Test-Path $app) -or !(Test-Path $installer)) { throw 'Both EXEs must be built' }
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path $app))
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          if ([BitConverter]::ToUInt16($bytes, $pe + 4) -ne 0x8664) { throw 'Application is not x64' }
          $installed = Join-Path $env:LOCALAPPDATA 'Programs\RallyCut\RallyCut.exe'
          $p = Start-Process -FilePath (Resolve-Path $installer) -ArgumentList '/S' -PassThru -Wait
          if ($p.ExitCode -ne 0 -or !(Test-Path $installed)) { throw 'Silent installer did not install application' }
          if ((Get-FileHash $app).Hash -ne (Get-FileHash $installed).Hash) { throw 'Installer did not install the correct payload' }
          $spec = (Get-Content 'build/runtime-output/runtime-bundle.json' -Raw | ConvertFrom-Json).platforms.'windows/amd64'
          $runtime = Join-Path (Split-Path $installed) "runtimes\$($spec.id)"
          if (!(Test-Path (Join-Path $runtime 'python\python.exe'))) { throw 'Installer did not expand Python before first launch' }
          if ((Get-FileHash (Join-Path $runtime 'bundle-manifest.json')).Hash.ToLowerInvariant() -ne $spec.manifest_sha256) { throw 'Installed environment manifest differs' }
          if (Test-Path (Join-Path (Split-Path $installed) 'runtime-payload.zip')) { throw 'Installer left a second first-run extraction step' }
          $env:RALLYCUT_INSTALLED_ROOT = $runtime
          go test -v ./backend/setup -run '^TestInstalledRuntimeFirstUse$' -count=1 -timeout 12m
          if ($LASTEXITCODE -ne 0) { throw 'First-use did not recognize the real installed runtime' }
          $data = Join-Path $env:APPDATA 'RallyCut'
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          $marker = Join-Path $data 'installer-preview-marker.txt'
          Set-Content -Path $marker -Value 'preserve user data'
          $uninstaller = Join-Path (Split-Path $installed) 'uninstall.exe'
          $p = Start-Process -FilePath $uninstaller -ArgumentList '/S' -PassThru -Wait
          if ($p.ExitCode -ne 0 -or (Test-Path $installed)) { throw 'Uninstaller did not remove application' }
          if (!(Test-Path $marker)) { throw 'Uninstaller deleted application data' }
          Remove-Item $marker
      - name: Require installer and record checksums
        shell: pwsh
        run: |
          $root = 'build/release'
          $app = Join-Path $root "RallyCut-$env:VERSION-windows-amd64.exe"
          $installer = Join-Path $root "RallyCut-$env:VERSION-windows-amd64-setup.exe"
          if (!(Test-Path $app) -or !(Test-Path $installer)) { throw 'Both portable EXE and NSIS installer are required' }
          $lines = Get-ChildItem $root -File | Where-Object { $_.Name -notlike 'SHA256SUMS*' } | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content -Encoding utf8NoBOM (Join-Path $root 'SHA256SUMS-windows.txt')
      - name: Upload installer and portable application
        uses: actions/upload-artifact@v4
        with:
          name: windows-preview-${{ inputs.version }}
          path: build/release/*
          retention-days: 14
          if-no-files-found: error
      - name: Upload real environment test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-environment-log
          path: |
            windows-environment-test.log
            windows-runtime-build.log
          retention-days: 14
          if-no-files-found: ignore
